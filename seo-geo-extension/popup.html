<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <style>
    /* Behåll din befintliga CSS från popup.css, men se till att popup-bredden är bra */
  </style>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wrap">
    <header class="header">
      <h1>SEO & GEO Checker</h1>
      <p>Personlig analys av aktuell flik.</p>
    </header>

    <section class="panel">
      <div class="row">
        <input id="urlInput" type="url" />
        <button id="analyzeBtn">Analysera</button>
      </div>
      <div id="loader" class="loader" hidden>
        <span class="spinner"></span>
        <span>Grok analyserar...</span>
      </div>
      <div id="errorBox" class="error" hidden></div>
    </section>

    <section id="results" class="results" hidden>
      <h2 class="sectionTitle">Teknik (Cloudflare)</h2>
      <div class="grid">
        <div class="card"><div class="kicker">Protokoll</div><div id="cfProto" class="value">-</div></div>
        <div class="card"><div class="kicker">Säkerhet</div><div id="cfSec" class="value">-</div></div>
        <div class="card"><div class="kicker">Edge Cache</div><div id="cfEdge" class="value">-</div></div>
        <div class="card"><div class="kicker">SSL/TLS</div><div id="cfSsl" class="value">-</div></div>
      </div>

      <h2 class="sectionTitle">GEO Analys</h2>
      <div class="report">
        <div class="metaRow">
          <span id="geoTotal" class="badge">GEO SCORE: -</span>
          <span id="geoCount" class="badge">0 delar</span>
        </div>
        <div id="geoList" class="geoList"></div>
      </div>
    </section>
  </div>
  <script src="popup.js"></script>
</body>
</html>
