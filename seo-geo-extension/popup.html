<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>GEO Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="popup.css"/>
</head>
<body>
  <div class="container">
    <header>
      <div class="eyebrow">AI-Powered Analysis</div>
      <h1>GEO Tracker</h1>
      <p class="subtitle">See how AI-engines perceive this site.</p>
      <div class="divider"></div>
    </header>

    <div class="search-wrap">
      <div class="search-box">
        <input type="text" id="urlInput" placeholder="https://yourwebsite.com" />
        <button id="analyzeBtn">Analyze</button>
      </div>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Analyzing...</p>
    </div>

    <div class="state-msg" id="emptyState">
      <div class="icon">—</div>
      <p>Enter a URL to get your GEO analysis</p>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <div class="results-header" id="resultsHeader">
      <div class="results-title">Analysis for <span id="urlLabel"></span></div>
      <div class="geo-score" id="geoScore"></div>
    </div>

    <div class="results" id="results"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
