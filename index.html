<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GEO Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f0eeeb;
      --white: #ffffff;
      --surface: #f7f6f4;
      --border: #e0ddd9;
      --text: #1a1a1a;
      --muted: #888580;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Cormorant Garamond', Georgia, serif;
      min-height: 100vh;
    }

    .container { max-width: 780px; margin: 0 auto; padding: 0 28px; }

    header { padding: 72px 0 52px; text-align: center; }

    .eyebrow {
      font-size: 11px; font-weight: 300; letter-spacing: 0.22em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 22px;
      display: flex; align-items: center; justify-content: center; gap: 12px;
    }
    .eyebrow::before, .eyebrow::after {
      content: ''; display: inline-block; width: 32px; height: 1px; background: var(--border);
    }

    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(2.8rem, 7vw, 5rem);
      font-weight: 700; line-height: 1.0;
      letter-spacing: -0.01em; color: var(--text); margin-bottom: 18px;
    }

    .subtitle {
      color: var(--muted); font-size: 1.15rem; font-weight: 300;
      font-style: italic; line-height: 1.6; max-width: 420px; margin: 0 auto;
    }

    .back-btn {
      position: fixed;
      top: 24px;
      left: 24px;
      z-index: 999;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 10px 22px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.75rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      transition: all 0.2s;
    }
    .back-btn:hover { background: var(--text); color: white; border-color: var(--text); }

    .divider { width: 48px; height: 1px; background: var(--border); margin: 24px auto 0; }

    .search-wrap { margin: 44px 0 16px; }
    .search-box { display: flex; gap: 12px; align-items: center; }

    .search-box input {
      flex: 1; background: var(--white); border: 1px solid var(--border);
      border-radius: 999px; outline: none; padding: 16px 24px;
      font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-box input:focus { border-color: var(--text); box-shadow: 0 0 0 3px rgba(26,26,26,0.07); }
    .search-box input::placeholder { color: var(--muted); font-style: italic; }

    .search-box button {
      background: var(--white); border: 1px solid var(--border); border-radius: 999px;
      padding: 16px 30px; color: var(--text); font-family: 'Cormorant Garamond', serif;
      font-size: 0.75rem; letter-spacing: 0.18em; text-transform: uppercase;
      cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    .search-box button:hover { background: var(--text); color: white; border-color: var(--text); }
    .search-box button:disabled { opacity: 0.4; cursor: not-allowed; }

    .loading { display: none; text-align: center; padding: 64px 0; }
    .loading.show { display: block; }
    .spinner {
      width: 28px; height: 28px; border: 1px solid var(--border);
      border-top-color: var(--text); border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading p { color: var(--muted); font-size: 0.9rem; font-style: italic; }

    .results-header {
      display: none; align-items: center; justify-content: space-between;
      margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border);
    }
    .results-header.show { display: flex; }
    .results-title { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
    .results-title span { color: var(--text); }
    .geo-score { font-family: 'Playfair Display', serif; font-size: 1rem; font-weight: 700; color: var(--text); }

    .results { display: none; flex-direction: column; gap: 12px; }
    .results.show { display: flex; }

    .card {
      background: var(--white); border: 1px solid var(--border); border-radius: 8px;
      overflow: hidden; animation: fadeUp 0.3s ease both;
    }
    .card:nth-child(2) { animation-delay: 0.05s; }
    .card:nth-child(3) { animation-delay: 0.1s; }
    .card:nth-child(4) { animation-delay: 0.15s; }
    .card:nth-child(5) { animation-delay: 0.2s; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-header {
      display: flex; align-items: center; gap: 16px;
      padding: 20px 24px; cursor: pointer; transition: background 0.15s;
      user-select: none;
    }
    .card-header:hover { background: var(--surface); }

    .card-left { flex: 1; }
    .card-pillar { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .card-question {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.0rem; font-weight: 400; line-height: 1.45; color: var(--text);
    }

    .score-badge {
      font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase;
      border: 1px solid var(--border); padding: 4px 10px; border-radius: 999px;
      white-space: nowrap; flex-shrink: 0; color: var(--text);
    }
    .score-badge.good { color: #2d7a2d; border-color: rgba(45,122,45,0.3); background: rgba(45,122,45,0.04); }
    .score-badge.mid  { color: #b07d00; border-color: rgba(176,125,0,0.3); background: rgba(176,125,0,0.04); }
    .score-badge.low  { color: #8b1a1a; border-color: rgba(139,26,26,0.3); background: rgba(139,26,26,0.04); }

    .score-bar-wrap { height: 2px; background: var(--border); }
    .score-bar { height: 100%; transition: width 1s ease; background: var(--text); }
    .score-bar.good { background: #2d7a2d; }
    .score-bar.mid  { background: #b07d00; }
    .score-bar.low  { background: #8b1a1a; }

    .card-body {
      padding: 0 24px;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease, padding 0.3s ease;
    }
    .card-body.open {
      max-height: 400px;
      padding: 16px 24px 22px;
    }
    .card-body p { font-size: 0.95rem; color: var(--muted); font-style: italic; line-height: 1.7; }

    .strategy-box {
      background: var(--white); border: 1px solid var(--border); border-radius: 8px;
      overflow: hidden; animation: fadeUp 0.3s ease 0.25s both;
    }
    .strategy-header {
      display: flex; align-items: center; gap: 16px;
      padding: 20px 24px; cursor: pointer; transition: background 0.15s;
      user-select: none;
    }
    .strategy-header:hover { background: var(--surface); }
    .strategy-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.0rem; font-weight: 400; color: var(--text); flex: 1;
    }
    .strategy-badge {
      font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase;
      border: 1px solid var(--border); padding: 4px 10px; border-radius: 999px;
      white-space: nowrap; color: var(--text);
    }
    .strategy-body {
      padding: 0 24px;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease, padding 0.3s ease;
    }
    .strategy-body.open {
      max-height: 600px;
      padding: 16px 24px 22px;
    }
    .strategy-body p { font-size: 0.95rem; color: var(--muted); font-style: italic; line-height: 1.8; white-space: pre-line; }

    .error-msg {
      display: none; text-align: center; padding: 36px; color: var(--muted);
      background: var(--white); border: 1px solid var(--border);
      border-radius: 8px; font-style: italic; margin-top: 24px;
    }
    .error-msg.show { display: block; }

    .state-msg { text-align: center; padding: 72px 0; color: var(--muted); }
    .state-msg .icon { font-size: 1.4rem; margin-bottom: 14px; opacity: 0.4; }
    .state-msg p { font-size: 1rem; font-style: italic; font-weight: 300; }

    footer { text-align: center; padding: 64px 0 44px; color: var(--muted); font-size: 0.78rem; letter-spacing: 0.08em; }
    footer::before { content: ''; display: block; width: 40px; height: 1px; background: var(--border); margin: 0 auto 24px; }
  </style>
</head>
<body>
  <a href="https://tovapersson.github.io/" class="back-btn">← Back to portfolio</a>
  <div class="container">
    <header>
      <div class="eyebrow">AI-Powered Analysis</div>
      <h1>GEO Tracker</h1>
      <p class="subtitle">Enter any URL and see how AI-engines perceive your brand.</p>
      <div class="divider"></div>
    </header>

    <div class="search-wrap">
      <div class="search-box">
        <input type="text" id="urlInput" placeholder="https://yourwebsite.com" />
        <button id="analyzeBtn" onclick="runAnalysis()">Analyze</button>
      </div>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Analyzing how AI perceives your brand...</p>
    </div>

    <div class="state-msg" id="emptyState">
      <div class="icon">—</div>
      <p>Enter a URL above to get your GEO analysis</p>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <div class="results-header" id="resultsHeader">
      <div class="results-title">Analysis for <span id="urlLabel"></span></div>
      <div class="geo-score" id="geoScore"></div>
    </div>

    <div class="results" id="results"></div>

    <footer>Powered by Claude AI · Built by Tova Persson</footer>
  </div>

  <script>
    async function runAnalysis() {
      const url = document.getElementById('urlInput').value.trim();
      if (!url || !url.startsWith('http')) {
        showError('Please enter a valid URL starting with https://');
        return;
      }

      const btn = document.getElementById('analyzeBtn');
      btn.disabled = true;
      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('loading').classList.add('show');
      document.getElementById('results').classList.remove('show');
      document.getElementById('resultsHeader').classList.remove('show');
      document.getElementById('errorMsg').classList.remove('show');

      try {
        const response = await fetch('/.netlify/functions/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'claude-haiku-4-5-20251001',
            max_tokens: 1500,
            messages: [{
              role: 'user',
              content: `You are an expert in SEO and GEO (Generative Engine Optimization). Analyze the website: ${url}

Return ONLY valid JSON, nothing else:
{
  "pillars": [
    { "name": "Authority", "question": "How is the site's authority perceived by AI?", "answer": "2-3 sentence analysis", "score": 7 },
    { "name": "Citations", "question": "Is the content optimized for citations in generative answers?", "answer": "2-3 sentence analysis", "score": 7 },
    { "name": "Relevance", "question": "How well does the content match user search intent?", "answer": "2-3 sentence analysis", "score": 7 },
    { "name": "Structure", "question": "Is there proper structure and schema markup for AI bots?", "answer": "2-3 sentence analysis", "score": 7 },
    { "name": "Uniqueness", "question": "Is the content unique enough for AI to choose as a source?", "answer": "2-3 sentence analysis", "score": 7 }
  ],
  "strategy": "1. First action\n2. Second action\n3. Third action\n4. Fourth action\n5. Fifth action"
}`
            }]
          })
        });

        const data = await response.json();
        const text = data.content[0].text.replace(/```json|```/g, '').trim();
        const parsed = JSON.parse(text);
        renderResults(url, parsed);

      } catch (err) {
        showError('Something went wrong. Please try again.');
      } finally {
        btn.disabled = false;
        document.getElementById('loading').classList.remove('show');
      }
    }

    function scoreClass(s) {
      if (s >= 8) return 'good';
      if (s >= 6) return 'mid';
      return 'low';
    }

    function renderResults(url, data) {
      try {
        document.getElementById('urlLabel').textContent = new URL(url).hostname;
      } catch { document.getElementById('urlLabel').textContent = url; }

      const avg = data.pillars.reduce((a, b) => a + b.score, 0) / data.pillars.length;
      document.getElementById('geoScore').textContent = `GEO Score: ${avg.toFixed(1)}/10`;
      document.getElementById('resultsHeader').classList.add('show');

      const container = document.getElementById('results');
      container.innerHTML = '';

      data.pillars.forEach((p, i) => {
        const cls = scoreClass(p.score);
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-header">
            <div class="card-left">
              <div class="card-pillar">${p.name}</div>
              <div class="card-question">${p.question}</div>
            </div>
            <div class="score-badge ${cls}">${p.score}/10</div>
          </div>
          <div class="score-bar-wrap">
            <div class="score-bar ${cls}" style="width:0%"></div>
          </div>
          <div class="card-body">
            <p>${p.answer}</p>
          </div>
        `;

        // Lägg till click-event direkt på elementet
        card.querySelector('.card-header').addEventListener('click', function() {
          card.querySelector('.card-body').classList.toggle('open');
        });

        container.appendChild(card);
        setTimeout(() => {
          card.querySelector('.score-bar').style.width = p.score * 10 + '%';
        }, 100 + i * 80);
      });

      if (data.strategy) {
        const stratCard = document.createElement('div');
        stratCard.className = 'strategy-box';
        stratCard.innerHTML = `
          <div class="strategy-header">
            <div class="strategy-title">Your Next Steps</div>
            <div class="strategy-badge">Action Plan</div>
          </div>
          <div class="strategy-body">
            <p>${data.strategy}</p>
          </div>
        `;

        stratCard.querySelector('.strategy-header').addEventListener('click', function() {
          stratCard.querySelector('.strategy-body').classList.toggle('open');
        });

        container.appendChild(stratCard);
      }

      container.classList.add('show');
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.classList.add('show');
    }

    document.getElementById('urlInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') runAnalysis();
    });
  </script>
</body>
</html>
